name: Build and publish RITM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ritm-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild, extract and test RITM
        shell: bash
        run: |
          set -euo pipefail
          cat source/archive-v2/part-* | base64 --decode > RITM.zip
          unzip -tq RITM.zip
          mkdir -p site
          unzip -q RITM.zip -d extracted
          cd extracted/RITM
          npm run check
          npm test
          node --check "$GITHUB_WORKSPACE/motion.js"
          cp "$GITHUB_WORKSPACE/motion.css" "$GITHUB_WORKSPACE/motion.js" "$GITHUB_WORKSPACE/site/"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          index = Path('index.html')
          html = index.read_text()
          html = html.replace(
              '<link rel="stylesheet" href="styles.css">',
              '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="motion.css?v=1.2.0">'
          )
          html = html.replace(
              '<script src="app.js" defer></script>',
              '<script src="app.js" defer></script>\n  <script src="motion.js?v=1.2.0" defer></script>'
          )
          index.write_text(html)

          worker = Path('sw.js')
          sw = re.sub(
              r"const CACHE_NAME = ['\"][^'\"]+['\"];",
              "const CACHE_NAME = 'ritm-static-v6';",
              worker.read_text(),
              count=1
          )
          sw = sw.replace(
              "'./app.js',",
              "'./app.js', './motion.css?v=1.2.0', './motion.js?v=1.2.0',"
          )
          worker.write_text(sw)

          package = Path('package.json')
          metadata = json.loads(package.read_text())
          metadata['version'] = '1.2.0'
          package.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n')
          PY
          cp -a . "$GITHUB_WORKSPACE/site/"

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
