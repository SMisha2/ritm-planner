name: Build and publish RITM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ritm-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild, extract and test RITM
        shell: bash
        run: |
          set -euo pipefail
          cat source/archive.part-* | base64 --decode > RITM.zip
          unzip -tq RITM.zip
          mkdir -p site
          unzip -q RITM.zip -d extracted
          cd extracted/RITM
          npm run check
          npm test
          cp -a . "$GITHUB_WORKSPACE/site/"

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
